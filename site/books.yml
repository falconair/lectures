# Book map for the online edition.
#
# Each book lists lecture notebooks in reading order. A notebook may appear in
# more than one book — these were taught as separate courses that share material.
# Paths are relative to the repository root.
#
# This file is a DRAFT for the author to correct: the groupings were inferred
# from directory numbering and notebook titles, not from how the courses were
# actually delivered.

site_title: "Lecture notes"
