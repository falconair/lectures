# Build and publish the online edition to GitHub Pages.
#
# Deploys to https://falconair.github.io/lectures/ , which is why the build is
# given --base-url /lectures/ rather than the "/" committed in site/books.yml.
# Keeping the committed value at "/" is deliberate: it is what site/serve.py
# needs to work locally.
name: Publish the online edition

on:
  push:
    branches: [main]
    paths:
      - 'lectures/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Not cancel-in-progress: a half-finished deploy
# leaves the published site in an unknown state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # LFS is deliberately NOT fetched. datasets/taxi-trips carries a 116MB
        # zip that the site never serves, and the build's MAX_DATASET_BYTES cap
        # would exclude it regardless.

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned to the versions site/environment.yml resolves to locally. The
      # conda env in site/build.sh is not used here; that script hardcodes
      # conda activation, which does not exist on the runner.
      - name: Install the build environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            jupyterlite-core==0.8.3 \
            jupyterlite-pyodide-kernel==0.8.5 \
            jupyter_server==2.21.0 \
            pyyaml==6.0.3

      - name: Build the site
        run: python site/scripts/build.py --base-url /lectures/

      # Pages would otherwise run the artifact through Jekyll, which skips
      # paths beginning with an underscore — JupyterLite ships plenty.
      - name: Disable Jekyll
        run: touch site/_site/.nojekyll

      # GitHub Pages refuses artifacts over 1GB. Fail here with a readable
      # message rather than at the deploy step with an opaque one.
      - name: Check the site fits
        run: |
          size=$(du -sm site/_site | cut -f1)
          echo "site is ${size}MB"
          if [ "$size" -gt 900 ]; then
            echo "::error::site is ${size}MB; GitHub Pages rejects over 1GB"
            exit 1
          fi
          echo "::notice::published site is ${size}MB"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
