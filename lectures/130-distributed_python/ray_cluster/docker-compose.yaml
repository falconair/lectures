services:
  ray-head:
    build: .
    image: ray-lecture-custom:latest
    container_name: ray-head
    hostname: ray-head
    ports:
      - "8265:8265"   # Ray Dashboard
      - "10001:10001" # Ray Client
      - "6379:6379"   # GCS
    command: >
      ray start --head --node-name=head-node --port=6379 
      --dashboard-host=0.0.0.0 --num-cpus=0 --block
    shm_size: '2gb'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6G

  ray-worker:
    image: ray-lecture-custom:latest
    depends_on:
      - ray-head
    # Using bash -c to keep the unique hostname logic for your readable names
    command: >
      bash -c "ray start --address=ray-head:6379 
      --node-name=worker-$$HOSTNAME --block"
    shm_size: '2gb'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    scale: 4

# --- LECTURE CHEAT SHEET ---
# 1. BUILD the custom image first:
#    docker-compose build
#
# 2. START the cluster (head + 1 worker):
#    docker-compose up -d
#
# 3. SCALE to see real-time speedup:
#    docker-compose up -d --scale ray-worker=3
#
# 4. MONITOR the "machines":
#    docker stats